<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Assistente Pessoal Inteligente</title>
<style>
  :root {
    --bg: #efece5;
    --card: #ffffff;
    --card-border: #e6e0d3;
    --text: #1c1a15;
    --muted: #8b8577;
    --dark: #17140f;
    --dark-tile: #2b271f;
    --work: #3d4fb0;
    --home: #2f7b4f;
    --personal: #8a4fbf;
    --accent: #2f4bd6;
    --accent-dark: #171d33;
    --rust: #b5502e;
    --pill-bg: #efe9dc;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .phone { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); position: relative; display: flex; flex-direction: column; }
  .content { flex: 1; padding: 20px 18px 12px; padding-bottom: 205px; }
  button { font: inherit; cursor: pointer; border: none; background: none; }
  a { color: inherit; }

  .mono { font-family: var(--mono); }
  .label-mono {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
  }

  /* Login */
  .login-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; text-align: center; gap: 16px; padding: 24px;
  }
  .login-screen h2 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
  .login-screen p { color: var(--muted); margin: 0 0 8px; max-width: 320px; line-height: 1.5; }
  .google-btn {
    display: flex; align-items: center; gap: 10px; background: #fff; color: #1a1a1a;
    border: 1px solid var(--card-border); padding: 13px 22px; font-size: 15px; font-weight: 600;
    border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }

  /* Header / greeting */
  .top-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
  .date-label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .progress-label { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .greeting { font-size: 30px; font-weight: 800; letter-spacing: -0.015em; margin: 2px 0 16px; }
  .page-title { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; margin: 4px 0 4px; }
  .page-subtitle { color: var(--muted); font-size: 13px; margin: 0 0 16px; }

  /* Resumo card */
  .resumo-card { background: var(--dark); color: #fff; border-radius: 18px; padding: 16px 16px 14px; margin-bottom: 22px; }
  .resumo-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .resumo-head .tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #a6a196; }
  .resumo-head .time { font-family: var(--mono); font-size: 12px; color: #a6a196; }
  .resumo-card p { margin: 0 0 14px; font-size: 15px; line-height: 1.45; }
  .resumo-tiles { display: flex; gap: 8px; }
  .resumo-tile { flex: 1; background: var(--dark-tile); border-radius: 10px; padding: 10px 12px; }
  .resumo-tile .num { font-size: 20px; font-weight: 800; line-height: 1.1; }
  .resumo-tile .lbl { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: #a6a196; margin-top: 2px; }

  /* Section headers */
  .section-header {
    display: flex; align-items: center; gap: 10px; margin: 20px 0 8px;
    font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--rust);
  }
  .section-header.neutral { color: var(--muted); }
  .section-header::after { content: ""; flex: 1; height: 1px; background: var(--card-border); }
  .section-header .count { color: var(--muted); font-weight: 400; }

  /* Task row */
  .task-row {
    display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 13px 14px; margin-bottom: 8px;
  }
  .task-row.done { opacity: 0.55; }
  .checkbox {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--card-border); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; background: #fff;
  }
  .checkbox.checked { background: var(--home); border-color: var(--home); color: #fff; font-size: 13px; }
  .task-row .body { flex: 1; min-width: 0; }
  .task-row .title { font-weight: 600; font-size: 15px; margin-bottom: 3px; }
  .task-row.done .title { text-decoration: line-through; }
  .task-row .meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .task-row .meta .time { font-family: var(--mono); color: var(--text); }
  .task-row.overdue .meta .time { color: var(--rust); font-weight: 600; }
  .cat-dot { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
  .badge-prio {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em;
    padding: 2px 7px; border-radius: 999px; background: var(--pill-bg); color: var(--muted);
  }
  .badge-prio.high { background: #f7dbd3; color: var(--rust); }
  .badge-low-conf { font-family: var(--mono); font-size: 10px; text-transform: uppercase; color: var(--rust); background: #f7dbd3; padding: 2px 7px; border-radius: 999px; }
  .chevron { color: var(--muted); font-size: 18px; flex-shrink: 0; }
  .cal-tag { font-size: 11px; color: var(--work); }

  .empty { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 14px; }

  /* Fixed input bar (Hoje quick-add / Chat message), pinned above the tab bar */
  .input-bar-wrap {
    position: fixed; left: 0; right: 0; display: flex; justify-content: center;
    background: var(--bg); z-index: 15;
  }
  .input-bar-inner { width: 100%; max-width: 480px; padding: 10px 18px; }

  /* Bottom quick-add bar (Hoje) */
  .quick-add-bar { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .quick-add-bar input {
    flex: 1; padding: 13px 16px; border-radius: 999px; border: 1px solid var(--card-border);
    font-size: 15px; background: var(--card); box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .quick-add-bar input:focus { outline: none; border-color: var(--accent); }
  .mic-btn {
    width: 46px; height: 46px; flex-shrink: 0; border-radius: 50%; border: none;
    background: var(--accent-dark); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .mic-btn.listening { background: var(--rust); }
  .mic-btn:disabled { opacity: 0.5; }

  /* Chat */
  .chat-scroll { display: flex; flex-direction: column; gap: 10px; margin-bottom: 4px; }
  .bubble { max-width: 85%; padding: 11px 15px; border-radius: 16px; font-size: 14.5px; line-height: 1.45; }
  .bubble.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bubble.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--card-border); border-bottom-left-radius: 4px; }
  .task-card-mini { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px; align-self: flex-start; max-width: 92%; }
  .task-card-mini .head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .task-card-mini .head .check { color: var(--home); font-size: 14px; }
  .task-card-mini .head .lbl { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--home); }
  .task-card-mini.cancelled .head .check { color: var(--rust); }
  .task-card-mini.cancelled .head .lbl { color: var(--rust); }
  .task-card-mini.cancelled .title { text-decoration: line-through; color: var(--muted); }
  .task-card-mini .title { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .task-card-mini .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip-tag { font-size: 12px; background: var(--pill-bg); color: var(--text); padding: 3px 10px; border-radius: 999px; }
  .task-card-mini .actions-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .task-card-mini .actions { display: flex; gap: 8px; }
  .btn-pill { font-size: 12.5px; padding: 6px 13px; border-radius: 999px; font-weight: 600; }
  .btn-pill.undo { background: #f7dbd3; color: var(--rust); }
  .btn-pill.undo.undone { opacity: 0.5; }
  .btn-pill.view { background: #dde3fb; color: var(--accent); }
  .confidence-note { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .chat-empty { text-align: center; color: var(--muted); padding: 30px 16px; font-size: 14px; }
  .thinking { font-size: 13px; color: var(--muted); padding: 4px 2px; }
  .suggest-row { display: flex; gap: 8px; overflow-x: auto; margin: 10px 0 12px; padding-bottom: 2px; }
  .suggest-chip { flex-shrink: 0; font-size: 13px; background: #dde3fb; color: var(--accent); padding: 7px 14px; border-radius: 999px; white-space: nowrap; }
  .chat-input-row { display: flex; align-items: center; gap: 10px; }
  .chat-input-row input {
    flex: 1; padding: 13px 16px; border-radius: 999px; border: 1px solid var(--card-border);
    font-size: 15px; background: var(--card);
  }
  .chat-input-row input:focus { outline: none; border-color: var(--accent); }
  .send-btn {
    width: 40px; height: 40px; border-radius: 50%; background: var(--pill-bg); color: var(--muted);
    display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
  }

  /* Agenda */
  .filter-row { display: flex; gap: 8px; margin-bottom: 18px; overflow-x: auto; }
  .filter-chip {
    display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--card-border);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; color: var(--text); flex-shrink: 0; white-space: nowrap;
  }
  .filter-chip.active { background: var(--dark); color: #fff; border-color: var(--dark); }
  .filter-dot { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
  .agenda-row {
    display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 13px 14px; margin-bottom: 8px;
  }
  .agenda-row .time { font-family: var(--mono); font-weight: 700; font-size: 14px; width: 46px; flex-shrink: 0; }
  .agenda-row .bar { width: 3px; align-self: stretch; border-radius: 2px; flex-shrink: 0; }
  .agenda-row .body { flex: 1; min-width: 0; }
  .agenda-row .title { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .agenda-row .sub { font-size: 12.5px; color: var(--muted); }

  /* History */
  .history-day-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px 15px; margin-bottom: 12px; }
  .history-day-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .history-day-head .day { font-weight: 700; font-size: 14.5px; }
  .history-day-head .day .date { font-weight: 400; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .history-day-head .ratio { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--rust); }
  .history-summary { font-size: 13.5px; color: var(--text); line-height: 1.45; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--card-border); }
  .history-event { display: flex; align-items: baseline; gap: 8px; font-size: 13px; padding: 3px 0; }
  .history-event .when { font-family: var(--mono); color: var(--muted); width: 44px; flex-shrink: 0; }
  .history-event .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .history-event .what { color: var(--text); }
  .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .search-row input {
    flex: 1; padding: 12px 15px; border-radius: 12px; border: 1px solid var(--card-border);
    font-size: 14px; background: var(--card);
  }
  .search-row input:focus { outline: none; border-color: var(--accent); }
  .search-result-chip {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: #dde3fb; border-radius: 12px; padding: 9px 13px; font-size: 13px; margin-bottom: 14px;
  }
  .search-result-chip .clear-search { color: var(--accent); font-size: 12px; text-decoration: underline; }

  /* Settings */
  .settings-section-label {
    font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted);
    margin: 20px 0 8px;
  }
  .settings-section-label:first-child { margin-top: 0; }
  .settings-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; overflow: hidden; }
  .settings-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 15px; border-bottom: 1px solid var(--card-border);
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-row .label { font-size: 14.5px; }
  .settings-row .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .settings-row .value { font-family: var(--mono); font-size: 13px; color: var(--accent); flex-shrink: 0; }
  .settings-row.link .label { color: var(--rust); font-weight: 600; }
  .settings-row.danger .label { color: var(--rust); font-weight: 600; }
  .btn-primary { background: var(--dark); color: #fff; padding: 12px 20px; font-weight: 700; font-size: 14.5px; border-radius: 12px; }
  .btn-primary:disabled { opacity: 0.5; }
  .btn-secondary { background: var(--pill-bg); color: var(--text); padding: 10px 16px; font-size: 13.5px; border-radius: 10px; }
  .danger-warning { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }

  /* Task detail modal (Hoje) */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(23,20,15,0.45); z-index: 40;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .modal-sheet {
    width: 100%; max-width: 480px; background: var(--card); border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 30px rgba(0,0,0,0.18);
  }
  .modal-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--card-border); margin: 0 auto 16px; }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .modal-title { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.25; }
  .modal-title.done-title { text-decoration: line-through; color: var(--muted); }
  .modal-close { color: var(--muted); font-size: 22px; line-height: 1; padding: 2px 4px; flex-shrink: 0; }
  .modal-meta-row { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); padding: 9px 0; border-bottom: 1px solid var(--card-border); }
  .modal-meta-row:last-of-type { border-bottom: none; }
  .modal-meta-row .lbl { color: var(--muted); width: 92px; flex-shrink: 0; font-size: 12.5px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.04em; }
  .modal-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .modal-btn { width: 100%; padding: 13px; border-radius: 12px; font-weight: 700; font-size: 14.5px; text-align: center; }
  .modal-btn.done { background: var(--dark); color: #fff; }
  .modal-btn.cancel { background: #f7dbd3; color: var(--rust); }
  .modal-btn.close-btn { background: var(--pill-bg); color: var(--text); }
  .modal-btn:disabled { opacity: 0.5; }

  .toast {
    position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%);
    background: var(--dark); color: #fff; padding: 12px 20px; border-radius: 12px;
    font-size: 13.5px; max-width: 90vw; text-align: center; z-index: 30;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  }

  /* Bottom tab bar */
  .tabbar-wrap {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center;
    background: linear-gradient(to top, var(--bg) 60%, transparent); padding-top: 14px; z-index: 20;
  }
  .tabbar-inner { width: 100%; max-width: 480px; }
  .tabbar {
    display: flex; background: var(--card); border-top: 1px solid var(--card-border);
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); padding: 4px 0; }
  .tab-btn.active { color: var(--accent); }
  .tab-btn svg { width: 22px; height: 22px; }
  .tab-btn .tab-label { font-size: 10.5px; }
</style>
</head>

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const hoje = new Date();
  const amanha = new Date(hoje.getTime() + 86400000);
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  const hora = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });
  if (sameDay(d, hoje)) return `Hoje, ${hora}`;
  if (sameDay(d, amanha)) return `Amanhã, ${hora}`;
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", timeZone: "America/Sao_Paulo" }) + `, ${hora}`;
}

async function maybeSaveGoogleToken(session) {
  const key = `google_token_saved:${session.user.id}`;
  if (session.provider_refresh_token) {
    try {
      await fetch(`${SUPABASE_URL}/functions/v1/salvar-token-google`, {
        method: "POST",
        headers: {
          "content-type": "application/json",
          Authorization: `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ refresh_token: session.provider_refresh_token }),
      });
      localStorage.setItem(key, "1");

      console.error("Erro ao salvar token do Google:", e);

async function marcarConcluida(task) {
  const { error } = await supabase.from("tasks").update({ status: "done" }).eq("id", task.id);
  if (!error) {
    await supabase.from("history").insert({
      user_id: state.session.user.id,
      task_id: task.id,
      action: "concluida",
      details: { titulo: task.title },
    });
    await loadTasks();
    loadResumo();
  }
}

async function enviarTarefa(texto) {
  setState({ submitting: true, chatMessages: [...state.chatMessages, { role: "user", text: texto }] });
  try {
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/processar-tarefa`, {
      method: "POST",
      headers: {
        "content-type": "application/json",
        Authorization: `Bearer ${state.session.access_token}`,
      },
      body: JSON.stringify({ texto }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || "Erro ao processar tarefa");

    let assistantMsg;
    if (data.tipo === "cancelada") {
      assistantMsg = {
        role: "assistant",
        text: "Tarefa cancelada.",
        cancelCard: {
          title: data.tarefa.title,
          due_at: data.tarefa.due_at,
          category: data.tarefa.category,
          priority: data.tarefa.priority,
          confianca: data.confianca,
        },
      };
    } else if (data.tipo === "cancelamento_nao_encontrado") {
      assistantMsg = { role: "assistant", text: data.mensagem || "Não encontrei essa tarefa." };
    } else {
      let calText = "";
      if (data.calendar_status === "criado") calText = "Evento adicionado ao Google Calendar.";
      else if (data.calendar_status === "erro") calText = "Não consegui criar o evento no Calendar.";
      assistantMsg = {
        role: "assistant",
        text: calText || "Tarefa criada.",
        taskCard: {
          id: data.tarefa.id,
          title: data.tarefa.title,
          due_at: data.tarefa.due_at,
          category: data.tarefa.category,
          priority: data.tarefa.priority,
          confianca: data.confianca,
          google_event_link: data.google_event_link,
        },
      };
    }
    setState({ submitting: false, chatMessages: [...state.chatMessages, assistantMsg] });
    await loadTasks();
    loadResumo();
  } catch (e) {
    setState({
      submitting: false,
      chatMessages: [...state.chatMessages, { role: "assistant", text: `Erro: ${e.message}` }],
    });
  }
}

async function desfazerTarefa(taskId, msgIndex) {

      method: "POST",

      body: JSON.stringify({ task_id: taskId }),

    setTimeout(() => setState({ toast: null }), 3000);

    setState({ toast: `Erro: ${e.message}` });
    setTimeout(() => setState({ toast: null }), 4000);
  }
}

async function buscarPeriodoPorPergunta(pergunta) {
  setState({ historySearching: true });
  try {
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/interpretar-periodo`, {
      method: "POST",
      headers: {
        "content-type": "application/json",
        Authorization: `Bearer ${state.session.access_token}`,
      },
      body: JSON.stringify({ pergunta }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || "Erro ao interpretar período");
    if (data.entendido === false) {
      setState({ historySearching: false, toast: "Não entendi esse período. Tenta de outro jeito?" });
      setTimeout(() => setState({ toast: null }), 4000);
      return;
    }
    setState({ historySearching: false, historySearchResult: data });
  } catch (e) {
    setState({ historySearching: false, toast: `Erro: ${e.message}` });
    setTimeout(() => setState({ toast: null }), 4000);
  }
}

function getSpeechRecognition() {
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

function iniciarEscutaHistorico() {
  const SpeechRecognition = getSpeechRecognition();
  if (!SpeechRecognition) {
    setState({ toast: "Seu navegador não suporta busca por voz. Digite a pergunta no campo." });
    setTimeout(() => setState({ toast: null }), 4000);
    return;
  }
  const rec = new SpeechRecognition();
  rec.lang = "pt-BR";
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onstart = () => setState({ historyListening: true });
  rec.onerror = () => setState({ historyListening: false });
  rec.onend = () => setState({ historyListening: false });
  rec.onresult = (event) => {
    const texto = event.results[0][0].transcript;
    setState({ historySearchText: texto });
    buscarPeriodoPorPergunta(texto);
  };
  rec.start();
}

function iniciarEscutaTarefa(onTexto) {
  const SpeechRecognition = getSpeechRecognition();
  if (!SpeechRecognition) {
    setState({ toast: "Seu navegador não suporta ditado por voz. Digite a tarefa no campo." });
    setTimeout(() => setState({ toast: null }), 4000);
    return;
  }
  const rec = new SpeechRecognition();
  rec.lang = "pt-BR";
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onstart = () => setState({ taskListening: true });
  rec.onerror = () => setState({ taskListening: false });
  rec.onend = () => setState({ taskListening: false });
  rec.onresult = (event) => {
    const texto = event.results[0][0].transcript;
    onTexto(texto);
  };
  rec.start();
}

function startOfDaySP(d) {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Sao_Paulo", year: "numeric", month: "2-digit", day: "2-digit",
  }).format(d);
  return new Date(`${parts}T00:00:00-03:00`);
}

function horaSP(d) {
  return parseInt(new Intl.DateTimeFormat("en-US", { timeZone: "America/Sao_Paulo", hour: "2-digit", hour12: false }).format(d), 10);
}

function periodoDoDia(hora) {
  if (hora < 12) return "Manhã";
  if (hora < 18) return "Tarde";
  return "Noite";
}

function dayLabelSP(d) {
  const hoje = startOfDaySP(new Date());
  const dia = startOfDaySP(d);
  const diffDias = Math.round((hoje - dia) / 86400000);
  if (diffDias === 0) return "Hoje";
  if (diffDias === -1) return "Amanhã";
  if (diffDias === 1) return "Ontem";
  return d.toLocaleDateString("pt-BR", { weekday: "long", timeZone: "America/Sao_Paulo" }).replace(/^\w/, (c) => c.toUpperCase());
}

function dateNumLabelSP(d) {
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short", timeZone: "America/Sao_Paulo" }).replace(".", "").toUpperCase();
}

function saudacao() {
  const hora = horaSP(new Date());
  if (hora < 12) return "Bom dia";
  if (hora < 18) return "Boa tarde";
  return "Boa noite";
}

function renderQuickAddBar() {
  const bar = document.createElement("div");
  bar.className = "quick-add-bar";
  const input = document.createElement("input");
  input.placeholder = "Diga o que precisa fazer…";
  input.autocomplete = "off";
  input.disabled = state.submitting;
  const submit = () => {
    const texto = input.value.trim();
    if (!texto || state.submitting) return;
    input.value = "";
    enviarTarefa(texto);
    updateActionBtnMode();
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });

  const actionBtn = document.createElement("button");
  actionBtn.type = "button";
  actionBtn.disabled = state.submitting;

  const setSendMode = () => {
    actionBtn.className = "send-btn";
    actionBtn.title = "Enviar mensagem";
    actionBtn.textContent = "↑";
    actionBtn.onclick = submit;
  };
  const setMicMode = () => {
    actionBtn.className = "mic-btn" + (state.taskListening ? " listening" : "");
    actionBtn.title = "Adicionar tarefa por voz";
    actionBtn.textContent = state.taskListening ? "●" : "🎤";
    actionBtn.onclick = () => {
      iniciarEscutaTarefa((texto) => {
        if (!texto || state.submitting) return;
        enviarTarefa(texto);
      });
    };
  };
  const updateActionBtnMode = () => {
    if (input.value.trim().length > 0) setSendMode();
    else setMicMode();
  };
  input.addEventListener("input", updateActionBtnMode);
  updateActionBtnMode();

  bar.appendChild(input);
  bar.appendChild(actionBtn);
  return bar;
}

function renderHoje() {
  const frag = document.createDocumentFragment();
  const agora = new Date();
  const inicioHoje = startOfDaySP(agora);
  const inicioAmanha = new Date(inicioHoje.getTime() + 86400000);

  const nome = (state.session.user.user_metadata?.full_name || state.session.user.email || "").split(" ")[0].split("@")[0];

  const topRow = document.createElement("div");
  topRow.className = "top-row";
  topRow.innerHTML = `
    <span class="date-label">${agora.toLocaleDateString("pt-BR", { weekday: "long", timeZone: "America/Sao_Paulo" }).slice(0, 3)} · ${dateNumLabelSP(agora)}</span>
    <span class="progress-label">${state.resumo?.feitasHoje ?? 0}/${state.resumo?.totalHoje ?? 0} feitas</span>
  `;
  frag.appendChild(topRow);

  const greeting = document.createElement("div");
  greeting.className = "greeting";
  greeting.textContent = `${saudacao()}${nome ? ", " + nome.charAt(0).toUpperCase() + nome.slice(1) : ""}`;
  frag.appendChild(greeting);

  const resumoCard = document.createElement("div");
  resumoCard.className = "resumo-card";
  const horaResumo = agora.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });
  if (state.resumoLoading) {
    resumoCard.innerHTML = `<div class="resumo-head"><span class="tag">Resumo da manhã</span><span class="time">${horaResumo}</span></div><p>Gerando seu resumo...</p>`;
  } else {
    const texto = state.resumo?.texto || "Não foi possível gerar o resumo agora.";
    resumoCard.innerHTML = `
      <div class="resumo-head"><span class="tag">Resumo da manhã</span><span class="time">${horaResumo}</span></div>
      <p>${escapeHtml(texto)}</p>
      <div class="resumo-tiles">
        <div class="resumo-tile"><div class="num">${state.resumo?.pendentes ?? 0}</div><div class="lbl">Pendentes</div></div>
        <div class="resumo-tile"><div class="num">${state.resumo?.atrasadas ?? 0}</div><div class="lbl">Atrasadas</div></div>
        <div class="resumo-tile"><div class="num">${state.resumo?.deOntem ?? 0}</div><div class="lbl">De ontem</div></div>
      </div>
    `;
  }
  frag.appendChild(resumoCard);

  const tarefasHoje = state.tasks.filter((t) => {
    const d = new Date(t.due_at);
    return d >= inicioHoje && d < inicioAmanha;
  });
  const atrasadas = state.tasks.filter((t) => new Date(t.due_at) < inicioHoje);

  if (atrasadas.length > 0) {
    const h = document.createElement("div");
    h.className = "section-header";
    h.innerHTML = `Atrasadas`;
    frag.appendChild(h);
    atrasadas.forEach((t) => frag.appendChild(renderTaskRow(t, { overdue: true })));
  }

  const grupos = { "Manhã": [], "Tarde": [], "Noite": [] };
  tarefasHoje.forEach((t) => grupos[periodoDoDia(horaSP(new Date(t.due_at)))].push(t));

  ["Manhã", "Tarde", "Noite"].forEach((periodo) => {
    if (grupos[periodo].length === 0) return;
    const h = document.createElement("div");
    h.className = "section-header neutral";
    h.innerHTML = periodo;
    frag.appendChild(h);
    grupos[periodo].forEach((t) => frag.appendChild(renderTaskRow(t)));
  });

  if (atrasadas.length === 0 && tarefasHoje.length === 0) {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "Nenhuma tarefa para hoje. Diga o que precisa fazer abaixo.";
    frag.appendChild(p);
  }

  return frag;
}

      scroll.appendChild(card);
    }

    if (msg.cancelCard) {

        </div>
      `;
      if (typeof msg.cancelCard.confianca === "number") {
        const actionsRow = document.createElement("div");
        actionsRow.className = "actions-row";
        const conf = document.createElement("span");
        conf.className = "confidence-note";
        conf.textContent = `confiança ${msg.cancelCard.confianca.toFixed(2)}`;
        actionsRow.appendChild(conf);
        card.appendChild(actionsRow);
      }
      scroll.appendChild(card);
    }
  });

  if (state.submitting) {
    const thinking = document.createElement("div");
    thinking.className = "thinking";
    thinking.textContent = "Interpretando sua tarefa...";
    scroll.appendChild(thinking);
  } else if (state.taskListening) {
    const thinking = document.createElement("div");
    thinking.className = "thinking";
    thinking.textContent = "Ouvindo... fale a tarefa.";
    scroll.appendChild(thinking);
  }

  frag.appendChild(scroll);

  const suggestRow = document.createElement("div");
  suggestRow.className = "suggest-row";
  ["Terça 9h dentista", "Adiar para 11h", "O que ficou pendente?"].forEach((s) => {
    const chip = document.createElement("button");
    chip.className = "suggest-chip";
    chip.textContent = s;
    chip.onclick = () => { if (!state.submitting) enviarTarefa(s); };
    suggestRow.appendChild(chip);
  });
  frag.appendChild(suggestRow);

  return frag;
}

function renderChatInputBar() {
  const inputRow = document.createElement("div");
  inputRow.className = "chat-input-row";
  const input = document.createElement("input");
  input.placeholder = "Mensagem";
  input.autocomplete = "off";
  const submit = () => {
    const texto = input.value.trim();
    if (!texto || state.submitting) return;
    input.value = "";
    enviarTarefa(texto);
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  const sendBtn = document.createElement("button");
  sendBtn.className = "send-btn";
  sendBtn.textContent = "↑";
  sendBtn.disabled = state.submitting;
  sendBtn.onclick = submit;
  const micBtn = document.createElement("button");
  micBtn.className = "mic-btn" + (state.taskListening ? " listening" : "");
  micBtn.title = "Adicionar tarefa por voz";
  micBtn.type = "button";
  micBtn.textContent = state.taskListening ? "●" : "🎤";
  micBtn.disabled = state.submitting;
  micBtn.onclick = () => {
    iniciarEscutaTarefa((texto) => {
      if (!texto || state.submitting) return;
      enviarTarefa(texto);
    });
  };
  inputRow.appendChild(input);
  inputRow.appendChild(sendBtn);
  inputRow.appendChild(micBtn);
  return inputRow;
}

function renderAgenda() {
  const frag = document.createDocumentFragment();

  const title = document.createElement("div");
  title.className = "page-title";
  title.textContent = "Agenda";
  title.style.marginBottom = "14px";
  frag.appendChild(title);

  const filterRow = document.createElement("div");
  filterRow.className = "filter-row";
  const opts = [
    ["todas", "Tudo", null],
    ["work", "Trabalho", "var(--work)"],
    ["home", "Casa", "var(--home)"],
    ["personal", "Pessoal", "var(--personal)"],
  ];
  opts.forEach(([key, label, color]) => {
    const chip = document.createElement("button");
    chip.className = "filter-chip" + (state.agendaFilter === key ? " active" : "");
    chip.innerHTML = (color ? `<span class="filter-dot" style="background:${color}"></span>` : "") + label;
    chip.onclick = () => setState({ agendaFilter: key });
    filterRow.appendChild(chip);
  });
  frag.appendChild(filterRow);

  const tarefas = state.tasks
    .filter((t) => state.agendaFilter === "todas" || t.category === state.agendaFilter)
    .slice()
    .sort((a, b) => new Date(a.due_at) - new Date(b.due_at));

  if (tarefas.length === 0) {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "Nenhuma tarefa nessa categoria.";
    frag.appendChild(p);
    return frag;
  }

  let ultimoDia = null;
  let grupoAtual = [];
  const flush = (label, dateStr) => {
    if (!grupoAtual.length) return;
    const h = document.createElement("div");
    h.className = "section-header neutral";
    h.innerHTML = `<span style="color:var(--text);font-weight:700;text-transform:none;font-family:inherit;font-size:13.5px">${label}</span> <span class="mono" style="font-size:11px">${dateStr}</span><span class="count" style="margin-left:auto">${grupoAtual.length} ${grupoAtual.length === 1 ? "tarefa" : "tarefas"}</span>`;
    frag.appendChild(h);
    grupoAtual.forEach((t) => {
      const cat = CATS[t.category] || CATS.personal;
      const row = document.createElement("div");
      row.className = "agenda-row";
      row.innerHTML = `
        <span class="time">${new Date(t.due_at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" })}</span>
        <span class="bar" style="background:${cat.color}"></span>
        <div class="body">
          <div class="title">${escapeHtml(t.title)}</div>
          <div class="sub">${cat.label} · ${PRIO_LABEL[t.priority] || t.priority}</div>
        </div>
      `;
      frag.appendChild(row);
    });
    grupoAtual = [];
  };

  tarefas.forEach((t) => {
    const d = new Date(t.due_at);
    const rotulo = dayLabelSP(d);
    if (rotulo !== ultimoDia) {
      flush(ultimoDia, ultimoDia ? dateNumLabelSP(new Date(tarefas.find((x) => dayLabelSP(new Date(x.due_at)) === ultimoDia).due_at)) : "");
      ultimoDia = rotulo;
    }
    grupoAtual.push(t);
  });
  flush(ultimoDia, dateNumLabelSP(new Date(grupoAtual[0].due_at)));

  return frag;
}

function filtrarHistorico(history, filtro) {
  if (filtro === "tudo") return history;
  const agora = new Date();
  const limiteDias = filtro === "hoje" ? 0 : 6;
  const inicio = new Date(startOfDaySP(agora).getTime() - limiteDias * 86400000);
  return history.filter((h) => new Date(h.created_at) >= inicio);
}

function filtrarPorIntervalo(history, dataInicio, dataFim) {
  const inicio = new Date(`${dataInicio}T00:00:00-03:00`);
  const fim = new Date(`${dataFim}T23:59:59-03:00`);
  return history.filter((h) => {
    const d = new Date(h.created_at);
    return d >= inicio && d <= fim;
  });
}

const ACTION_DOT_COLOR = {
  criada: "var(--work)",
  concluida: "var(--home)",
  remarcada: "#d29922",
  desfeita: "var(--rust)",
  excluida: "var(--rust)",
};

function renderHistory() {
  const frag = document.createDocumentFragment();

  const title = document.createElement("div");
  title.innerHTML = `<div class="page-title">Histórico</div><div class="page-subtitle">Registro de eventos e resumos fechados</div>`;
  frag.appendChild(title);

  const searchRow = document.createElement("div");
  searchRow.className = "search-row";
  const searchInput = document.createElement("input");
  searchInput.placeholder = "Pergunte, ex: \"o que eu fiz na quinta passada?\"";
  searchInput.autocomplete = "off";
  searchInput.value = state.historySearchText;
  searchInput.oninput = (e) => { state.historySearchText = e.target.value; };
  const submitSearch = () => {
    const pergunta = searchInput.value.trim();
    if (!pergunta || state.historySearching) return;
    buscarPeriodoPorPergunta(pergunta);
  };
  searchInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submitSearch(); });
  const micBtn = document.createElement("button");
  micBtn.className = "mic-btn" + (state.historyListening ? " listening" : "");
  micBtn.title = "Perguntar por voz";
  micBtn.textContent = state.historyListening ? "●" : "🎤";
  micBtn.onclick = iniciarEscutaHistorico;
  searchRow.appendChild(searchInput);
  searchRow.appendChild(micBtn);
  frag.appendChild(searchRow);

  if (state.historySearching) {
    const thinking = document.createElement("div");
    thinking.className = "thinking";
    thinking.textContent = "Entendendo o período perguntado...";
    frag.appendChild(thinking);
  }

  if (state.historySearchResult) {
    const chip = document.createElement("div");
    chip.className = "search-result-chip";
    chip.innerHTML = `<span>Mostrando: <strong>${escapeHtml(state.historySearchResult.descricao)}</strong></span>`;
    const clearBtn = document.createElement("button");
    clearBtn.className = "clear-search";
    clearBtn.textContent = "limpar";
    clearBtn.onclick = () => setState({ historySearchResult: null, historySearchText: "" });
    chip.appendChild(clearBtn);
    frag.appendChild(chip);
  } else {
    const suggestRow = document.createElement("div");
    suggestRow.className = "suggest-row";
    ["O que eu fiz ontem?", "Quais ficaram pendentes?", "Como foi a semana?"].forEach((s) => {
      const chip = document.createElement("button");
      chip.className = "suggest-chip";
      chip.textContent = s;
      chip.onclick = () => buscarPeriodoPorPergunta(s);
      suggestRow.appendChild(chip);
    });
    frag.appendChild(suggestRow);

    const filterRow = document.createElement("div");
    filterRow.className = "filter-row";
    [["hoje", "Hoje"], ["semana", "Esta semana"], ["tudo", "Tudo"]].forEach(([key, label]) => {
      const chip = document.createElement("button");
      chip.className = "filter-chip" + (state.historyFilter === key ? " active" : "");
      chip.textContent = label;
      chip.onclick = () => setState({ historyFilter: key });
      filterRow.appendChild(chip);
    });
    frag.appendChild(filterRow);
  }

  const itens = state.historySearchResult
    ? filtrarPorIntervalo(state.history, state.historySearchResult.data_inicio, state.historySearchResult.data_fim)
    : filtrarHistorico(state.history, state.historyFilter);

  if (itens.length === 0) {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "Nada por aqui neste período.";
    frag.appendChild(p);
    return frag;
  }

  const grupos = new Map();
  itens.forEach((h) => {
    const d = new Date(h.created_at);
    const key = startOfDaySP(d).toISOString();
    if (!grupos.has(key)) grupos.set(key, { date: d, items: [] });
    grupos.get(key).items.push(h);
  });

  Array.from(grupos.values()).forEach(({ date, items }) => {
    const card = document.createElement("div");
    card.className = "history-day-card";
    const concluidas = items.filter((h) => h.action === "concluida").length;
    const criadas = items.filter((h) => h.action === "criada").length;
    const total = criadas || items.length;
    const rotulo = dayLabelSP(date);
    const diaSemana = date.toLocaleDateString("pt-BR", { weekday: "long", timeZone: "America/Sao_Paulo" });
    const label = rotulo === "Hoje" || rotulo === "Ontem" || rotulo === "Amanhã" ? rotulo : diaSemana.charAt(0).toUpperCase() + diaSemana.slice(1);
    let head = `<div class="history-day-head"><span class="day">${label} <span class="date">· ${dateNumLabelSP(date)}</span></span>`;
    if (total > 0) head += `<span class="ratio">${concluidas}/${total}</span>`;
    head += `</div>`;
    card.innerHTML = head;

    items.slice().reverse().forEach((h) => {
      const hora = new Date(h.created_at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });
      const titulo = h.details?.titulo || h.details?.tarefa?.titulo || h.details?.tarefa?.title || "";
      const acaoLabel = { criada: "Criada", concluida: "Concluída", remarcada: "Remarcada", excluida: "Excluída", desfeita: "Desfeita" }[h.action] || h.action;
      const cor = ACTION_DOT_COLOR[h.action] || "var(--muted)";
      const ev = document.createElement("div");
      ev.className = "history-event";
      ev.innerHTML = `<span class="when">${hora}</span><span class="dot" style="background:${cor}"></span><span class="what"><strong>${acaoLabel}</strong>${titulo ? ": " + escapeHtml(titulo) : ""}</span>`;
      card.appendChild(ev);
    });

    frag.appendChild(card);
  });

  return frag;
}

function renderSettings() {
  const frag = document.createDocumentFragment();

  const title = document.createElement("div");
  title.className = "page-title";
  title.textContent = "Ajustes";
  title.style.marginBottom = "16px";
  frag.appendChild(title);

  const lbl1 = document.createElement("div");
  lbl1.className = "settings-section-label";
  lbl1.textContent = "Assistente & notificações";
  frag.appendChild(lbl1);

  const card1 = document.createElement("div");
  card1.className = "settings-card";
  card1.innerHTML = `
    <div class="settings-row"><div><div class="label">Resumo diário</div><div class="sub">gerado por IA ao abrir o app</div></div><span class="value">ativo</span></div>
    <div class="settings-row"><div><div class="label">Notificações</div><div class="sub">lembretes padrão do Google Calendar, não são push do navegador</div></div></div>
    <div class="settings-row"><div><div class="label">IA de interpretação</div><div class="sub">extrai título, data, hora e prioridade</div></div><span class="value">Claude</span></div>
  `;
  frag.appendChild(card1);

  const lbl2 = document.createElement("div");
  lbl2.className = "settings-section-label";
  lbl2.textContent = "Conta";
  frag.appendChild(lbl2);

  const card2 = document.createElement("div");
  card2.className = "settings-card";
  card2.innerHTML = `<div class="settings-row"><span class="label">E-mail</span><span class="value">${escapeHtml(state.session.user.email)}</span></div>`;
  const logoutRow = document.createElement("div");
  logoutRow.className = "settings-row link";
  logoutRow.innerHTML = `<span class="label">Sair da conta</span>`;
  logoutRow.onclick = handleLogout;
  card2.appendChild(logoutRow);
  frag.appendChild(card2);

  const lbl3 = document.createElement("div");
  lbl3.className = "settings-section-label";
  lbl3.textContent = "Zona de risco";
  frag.appendChild(lbl3);

  const card3 = document.createElement("div");
  card3.className = "settings-card";
  card3.style.padding = "15px";
  if (!state.confirmDeleteAccount) {
    card3.innerHTML = `<div class="danger-warning">Apaga permanentemente suas tarefas, histórico e a conexão com o Google.</div>`;
    const delBtn = document.createElement("button");
    delBtn.className = "btn-secondary";
    delBtn.style.color = "var(--rust)";
    delBtn.textContent = "Excluir conta e dados";
    delBtn.onclick = () => setState({ confirmDeleteAccount: true });
    card3.appendChild(delBtn);
  } else {
    card3.innerHTML = `<div class="danger-warning">Tem certeza? Essa ação não pode ser desfeita.</div>`;
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:8px;";
    const confirmBtn = document.createElement("button");
    confirmBtn.className = "btn-secondary";
    confirmBtn.style.color = "var(--rust)";
    confirmBtn.textContent = state.deletingAccount ? "Excluindo..." : "Confirmar exclusão";
    confirmBtn.disabled = state.deletingAccount;
    confirmBtn.onclick = excluirConta;
    const cancelBtn = document.createElement("button");
    cancelBtn.className = "btn-secondary";
    cancelBtn.textContent = "Cancelar";
    cancelBtn.disabled = state.deletingAccount;
    cancelBtn.onclick = () => setState({ confirmDeleteAccount: false });
    row.appendChild(confirmBtn);
    row.appendChild(cancelBtn);
    card3.appendChild(row);
  }
  frag.appendChild(card3);

  return frag;
}

function renderTabBar() {
  const wrap = document.createElement("div");
  wrap.className = "tabbar-wrap";
  const inner = document.createElement("div");
  inner.className = "tabbar-inner";
  const bar = document.createElement("div");
  bar.className = "tabbar";
  TABS.forEach(([key, label, icon]) => {
    const b = document.createElement("button");
    b.className = "tab-btn" + (state.tab === key ? " active" : "");
    b.innerHTML = `${icon}<span class="tab-label">${label}</span>`;
    b.onclick = () => {
      setState({ tab: key });
      if (key === "history") loadHistory();
      if (key === "hoje" && !state.resumo && !state.resumoLoading) loadResumo();
    };
    bar.appendChild(b);
  });
  inner.appendChild(bar);
  wrap.appendChild(inner);
  return wrap;
}

function renderInputBar() {
  if (state.tab !== "hoje" && state.tab !== "chat") return null;
  const wrap = document.createElement("div");
  wrap.className = "input-bar-wrap";
  const inner = document.createElement("div");
  inner.className = "input-bar-inner";
  inner.appendChild(state.tab === "hoje" ? renderQuickAddBar() : renderChatInputBar());
  wrap.appendChild(inner);
  return wrap;
}

function renderTaskDetailModal() {
  if (!state.selectedTaskId) return null;
  const task = state.tasks.find((t) => t.id === state.selectedTaskId);
  if (!task) return null;

  const cat = CATS[task.category] || CATS.personal;
  const loading = state.taskModalLoading;

  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.onclick = (e) => { if (e.target === backdrop && !loading) setState({ selectedTaskId: null }); };

  const sheet = document.createElement("div");
  sheet.className = "modal-sheet";
  sheet.onclick = (e) => e.stopPropagation();

  const handle = document.createElement("div");
  handle.className = "modal-handle";
  sheet.appendChild(handle);

  const head = document.createElement("div");
  head.className = "modal-head";
  head.innerHTML = `<div class="modal-title">${escapeHtml(task.title)}</div>`;
  const closeBtn = document.createElement("button");
  closeBtn.className = "modal-close";
  closeBtn.textContent = "×";
  closeBtn.disabled = !!loading;
  closeBtn.onclick = () => setState({ selectedTaskId: null });
  head.appendChild(closeBtn);
  sheet.appendChild(head);

  const dataFmt = new Date(task.due_at).toLocaleDateString("pt-BR", {
    weekday: "long", day: "2-digit", month: "long", timeZone: "America/Sao_Paulo",
  });
  const horaFmt = new Date(task.due_at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });

  const rows = document.createElement("div");
  rows.innerHTML = `
    <div class="modal-meta-row"><span class="lbl">Quando</span><span>${dataFmt.charAt(0).toUpperCase() + dataFmt.slice(1)} · ${horaFmt}</span></div>
    <div class="modal-meta-row"><span class="lbl">Categoria</span><span class="cat-dot" style="background:${cat.color}"></span><span>${cat.label}</span></div>
    <div class="modal-meta-row"><span class="lbl">Prioridade</span><span>${PRIO_LABEL[task.priority] || task.priority}</span></div>
    <div class="modal-meta-row"><span class="lbl">Calendar</span><span>${task.google_event_id ? "Sincronizada com o Google Calendar" : "Não sincronizada"}</span></div>
  `;
  sheet.appendChild(rows);

  const actions = document.createElement("div");
  actions.className = "modal-actions";

  const doneBtn = document.createElement("button");
  doneBtn.className = "modal-btn done";
  doneBtn.textContent = loading === "concluir" ? "Concluindo…" : "Marcar como concluída";
  doneBtn.disabled = !!loading;
  doneBtn.onclick = () => concluirTarefaDetalhe(task);
  actions.appendChild(doneBtn);

  const cancelBtn = document.createElement("button");
  cancelBtn.className = "modal-btn cancel";
  cancelBtn.textContent = loading === "cancelar" ? "Cancelando…" : "Cancelar tarefa";
  cancelBtn.disabled = !!loading;
  cancelBtn.onclick = () => cancelarTarefaDetalhe(task);
  actions.appendChild(cancelBtn);

  const closeActionBtn = document.createElement("button");
  closeActionBtn.className = "modal-btn close-btn";
  closeActionBtn.textContent = "Fechar";
  closeActionBtn.disabled = !!loading;
  closeActionBtn.onclick = () => setState({ selectedTaskId: null });
  actions.appendChild(closeActionBtn);

  sheet.appendChild(actions);
  backdrop.appendChild(sheet);
  return backdrop;
}

function renderApp() {
  const wrap = document.createDocumentFragment();

  const content = document.createElement("div");
  content.className = "content";
  if (state.tab === "hoje") content.appendChild(renderHoje());
  else if (state.tab === "chat") content.appendChild(renderChat());
  else if (state.tab === "agenda") content.appendChild(renderAgenda());
  else if (state.tab === "history") content.appendChild(renderHistory());
  else content.appendChild(renderSettings());
  wrap.appendChild(content);

  const inputBar = renderInputBar();
  if (inputBar) wrap.appendChild(inputBar);

  wrap.appendChild(renderTabBar());

  const modal = renderTaskDetailModal();
  if (modal) wrap.appendChild(modal);

  if (state.toast) {
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = state.toast;
    wrap.appendChild(t);
  }

  return wrap;
}

function render() {
  app.innerHTML = "";
  if (!state.session) {
    app.appendChild(renderLogin());
  } else {
    app.appendChild(renderApp());
    const tabbarEl = app.querySelector(".tabbar-wrap");
    const inputBarEl = app.querySelector(".input-bar-wrap");
    if (tabbarEl && inputBarEl) {
      inputBarEl.style.bottom = tabbarEl.offsetHeight + "px";
    }
  }
}

async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    setState({ session });
    await maybeSaveGoogleToken(session);
    await loadTasks();
    loadResumo();
  } else {
    render();
  }

  supabase.auth.onAuthStateChange(async (event, session) => {
    if (event === "SIGNED_IN" && session) {
      setState({ session });
      await maybeSaveGoogleToken(session);
      await loadTasks();
      loadResumo();
    } else if (event === "SIGNED_OUT") {
      setState({ session: null, tasks: [], history: [] });
    }
  });
}

init();
