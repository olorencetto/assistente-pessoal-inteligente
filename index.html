<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Assistente Pessoal Inteligente</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --work: #2F5AA8;
    --home: #1F7A5C;
    --personal: #8A4FBF;
    --accent: #111827;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 100px; }
  header.app-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0 20px;
  }
  header.app-header h1 { font-size: 20px; margin: 0; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .user-chip img { width: 28px; height: 28px; border-radius: 50%; }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 10px;
  }
  .btn-primary {
    background: var(--accent); color: #fff; padding: 12px 18px; font-weight: 600; font-size: 15px;
  }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-secondary {
    background: transparent; color: var(--muted); padding: 8px 12px; font-size: 13px; border: 1px solid var(--border);
  }
  .login-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 70vh; text-align: center; gap: 16px;
  }
  .login-screen h2 { margin: 0; font-size: 22px; }
  .login-screen p { color: var(--muted); margin: 0 0 8px; max-width: 320px; }
  .google-btn {
    display: flex; align-items: center; gap: 10px; background: #fff; color: #1a1a1a;
    border: 1px solid var(--border); padding: 12px 20px; font-size: 15px; font-weight: 500;
    border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-bottom: 12px;
  }
  .input-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .input-row input {
    flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    font-size: 15px; background: var(--card);
  }
  .input-row input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab {
    background: none; padding: 10px 14px; font-size: 14px; color: var(--muted); font-weight: 500;
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .task { display: flex; align-items: flex-start; gap: 12px; }
  .task .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
  .task .body { flex: 1; min-width: 0; }
  .task .title { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .task .meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: #f1f1f3; color: var(--muted);
  }
  .badge.high { background: #fdecea; color: var(--danger); }
  .task .cal-link { font-size: 12px; color: var(--work); text-decoration: none; }
  .task .done-btn {
    background: none; border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px;
    font-size: 12px; color: var(--muted); flex-shrink: 0;
  }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--accent); color: #fff; padding: 12px 20px; border-radius: 10px;
    font-size: 14px; max-width: 90vw; text-align: center; z-index: 20;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  .thinking { font-size: 13px; color: var(--muted); padding: 4px 2px 16px; }
  .footer-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 24px; }
  .history-item { border-bottom: 1px solid var(--border); padding: 10px 0; }
  .history-item:last-child { border-bottom: none; }
  .history-item .when { font-size: 12px; color: var(--muted); }
  .history-item .what { font-size: 14px; margin-top: 2px; }
  .history-day-header { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 18px 0 6px; }
  .history-day-header:first-child { margin-top: 0; }
  .filter-row { display: flex; gap: 6px; margin-bottom: 14px; }
  .filter-chip {
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 14px; font-size: 13px; color: var(--muted);
  }
  .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .search-row input {
    flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
    font-size: 14px; background: var(--card);
  }
  .search-row input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .mic-btn {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .mic-btn.listening { background: var(--danger); border-color: var(--danger); color: #fff; }
  .search-result-chip {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 10px; padding: 8px 12px;
    font-size: 13px; margin-bottom: 14px;
  }
  .search-result-chip .clear-search { background: none; color: var(--muted); font-size: 12px; text-decoration: underline; padding: 0; }
  a { color: inherit; }
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://yhzlpoucnghbumkhtoxo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inloemxwb3VjbmdoYnVta2h0b3hvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NjY4ODcsImV4cCI6MjEwNTM0Mjg4N30.YcUbNzNv0CBkNTmTJme98wcPhZmsr3WB7ADpM9vIzpU";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATS = {
  work: { label: "Trabalho", color: "var(--work)" },
  home: { label: "Casa", color: "var(--home)" },
  personal: { label: "Pessoal", color: "var(--personal)" },
};
const PRIO_LABEL = { low: "baixa", medium: "média", high: "alta" };

const app = document.getElementById("app");
let state = {
  session: null,
  tab: "home",
  tasks: [],
  history: [],
  historyFilter: "semana",
  historySearchText: "",
  historySearchResult: null, // { data_inicio, data_fim, descricao }
  historySearching: false,
  historyListening: false,
  taskListening: false,
  loadingTasks: false,
  submitting: false,
  toast: null,
};

function setState(patch) {
  state = { ...state, ...patch };
  render();
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const hoje = new Date();
  const amanha = new Date(hoje.getTime() + 86400000);
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  const hora = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });
  if (sameDay(d, hoje)) return `Hoje, ${hora}`;
  if (sameDay(d, amanha)) return `Amanhã, ${hora}`;
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", timeZone: "America/Sao_Paulo" }) + `, ${hora}`;
}

async function handleLogin() {
  await supabase.auth.signInWithOAuth({
    provider: "google",
    options: {
      scopes: "https://www.googleapis.com/auth/calendar.events",
      queryParams: { access_type: "offline", prompt: "consent" },
      redirectTo: window.location.href.split("#")[0].split("?")[0],
    },
  });
}

async function handleLogout() {
  await supabase.auth.signOut();
  setState({ session: null, tasks: [], history: [] });
}

async function maybeSaveGoogleToken(session) {
  const key = `google_token_saved:${session.user.id}`;
  if (session.provider_refresh_token) {
    try {
      await fetch(`${SUPABASE_URL}/functions/v1/salvar-token-google`, {
        method: "POST",
        headers: {
          "content-type": "application/json",
          Authorization: `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ refresh_token: session.provider_refresh_token }),
      });
      localStorage.setItem(key, "1");
    } catch (e) {
      console.error("Erro ao salvar token do Google:", e);
    }
  }
}

async function loadTasks() {
  setState({ loadingTasks: true });
  const { data, error } = await supabase
    .from("tasks")
    .select("*")
    .neq("status", "cancelled")
    .order("due_at", { ascending: true });
  if (error) console.error(error);
  setState({ tasks: data || [], loadingTasks: false });
}

async function loadHistory() {
  const { data, error } = await supabase
    .from("history")
    .select("*")
    .order("created_at", { ascending: false })
    .limit(200);
  if (error) console.error(error);
  setState({ history: data || [] });
}

async function marcarConcluida(task) {
  const { error } = await supabase.from("tasks").update({ status: "done" }).eq("id", task.id);
  if (!error) {
    await supabase.from("history").insert({
      user_id: state.session.user.id,
      task_id: task.id,
      action: "concluida",
      details: { titulo: task.title },
    });
    loadTasks();
  }
}

async function enviarTarefa(texto) {
  setState({ submitting: true });
  try {
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/processar-tarefa`, {
      method: "POST",
      headers: {
        "content-type": "application/json",
        Authorization: `Bearer ${state.session.access_token}`,
      },
      body: JSON.stringify({ texto }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || "Erro ao processar tarefa");

    let msg = `Tarefa criada: "${data.tarefa.title}"`;
    if (data.calendar_status === "criado") msg += " — evento adicionado ao Google Calendar.";
    else if (data.calendar_status === "erro") msg += " — não consegui criar o evento no Calendar (verifique a conexão).";
    setState({ toast: msg, submitting: false });
    await loadTasks();
    setTimeout(() => setState({ toast: null }), 5000);
  } catch (e) {
    setState({ toast: `Erro: ${e.message}`, submitting: false });
    setTimeout(() => setState({ toast: null }), 5000);
  }
}

async function buscarPeriodoPorPergunta(pergunta) {
  setState({ historySearching: true });
  try {
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/interpretar-periodo`, {
      method: "POST",
      headers: {
        "content-type": "application/json",
        Authorization: `Bearer ${state.session.access_token}`,
      },
      body: JSON.stringify({ pergunta }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || "Erro ao interpretar período");
    if (data.entendido === false) {
      setState({ historySearching: false, toast: "Não entendi esse período. Tenta de outro jeito?" });
      setTimeout(() => setState({ toast: null }), 4000);
      return;
    }
    setState({ historySearching: false, historySearchResult: data });
  } catch (e) {
    setState({ historySearching: false, toast: `Erro: ${e.message}` });
    setTimeout(() => setState({ toast: null }), 4000);
  }
}

function getSpeechRecognition() {
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

function iniciarEscutaHistorico() {
  const SpeechRecognition = getSpeechRecognition();
  if (!SpeechRecognition) {
    setState({ toast: "Seu navegador não suporta busca por voz. Digite a pergunta no campo." });
    setTimeout(() => setState({ toast: null }), 4000);
    return;
  }
  const rec = new SpeechRecognition();
  rec.lang = "pt-BR";
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onstart = () => setState({ historyListening: true });
  rec.onerror = () => setState({ historyListening: false });
  rec.onend = () => setState({ historyListening: false });
  rec.onresult = (event) => {
    const texto = event.results[0][0].transcript;
    setState({ historySearchText: texto });
    buscarPeriodoPorPergunta(texto);
  };
  rec.start();
}

function iniciarEscutaTarefa(onTexto) {
  const SpeechRecognition = getSpeechRecognition();
  if (!SpeechRecognition) {
    setState({ toast: "Seu navegador não suporta ditado por voz. Digite a tarefa no campo." });
    setTimeout(() => setState({ toast: null }), 4000);
    return;
  }
  const rec = new SpeechRecognition();
  rec.lang = "pt-BR";
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onstart = () => setState({ taskListening: true });
  rec.onerror = () => setState({ taskListening: false });
  rec.onend = () => setState({ taskListening: false });
  rec.onresult = (event) => {
    const texto = event.results[0][0].transcript;
    onTexto(texto);
  };
  rec.start();
}

function renderLogin() {
  const div = document.createElement("div");
  div.className = "login-screen";
  div.innerHTML = `
    <h2>Assistente Pessoal Inteligente</h2>
    <p>Entre com sua conta Google para sincronizar suas tarefas com o Google Calendar e receber notificações reais.</p>
  `;
  const btn = document.createElement("button");
  btn.className = "google-btn";
  btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
    Entrar com Google
  `;
  btn.onclick = handleLogin;
  div.appendChild(btn);
  return div;
}

function renderTaskRow(task) {
  const cat = CATS[task.category] || CATS.personal;
  const row = document.createElement("div");
  row.className = "card task";
  row.innerHTML = `
    <div class="dot" style="background:${cat.color}"></div>
    <div class="body">
      <div class="title">${escapeHtml(task.title)}</div>
      <div class="meta">
        <span>${fmtDate(task.due_at)}</span>
        <span class="badge">${cat.label}</span>
        <span class="badge ${task.priority === "high" ? "high" : ""}">${PRIO_LABEL[task.priority] || task.priority}</span>
        ${task.google_event_id ? `<span class="cal-link">📅 no Calendar</span>` : ""}
      </div>
    </div>
  `;
  const doneBtn = document.createElement("button");
  doneBtn.className = "done-btn";
  doneBtn.textContent = "Concluir";
  doneBtn.onclick = () => marcarConcluida(task);
  row.appendChild(doneBtn);
  return row;
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

function renderHome() {
  const frag = document.createDocumentFragment();

  const inputRow = document.createElement("div");
  inputRow.className = "input-row";
  const input = document.createElement("input");
  input.placeholder = "Ex: amanhã tenho dentista às 17h";
  input.autocomplete = "off";
  const sendBtn = document.createElement("button");
  sendBtn.className = "btn-primary";
  sendBtn.textContent = state.submitting ? "..." : "Adicionar";
  sendBtn.disabled = state.submitting;
  const submit = () => {
    const texto = input.value.trim();
    if (!texto || state.submitting) return;
    input.value = "";
    enviarTarefa(texto);
  };
  sendBtn.onclick = submit;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  const micBtn = document.createElement("button");
  micBtn.className = "mic-btn" + (state.taskListening ? " listening" : "");
  micBtn.title = "Adicionar tarefa por voz";
  micBtn.type = "button";
  micBtn.textContent = state.taskListening ? "●" : "🎤";
  micBtn.disabled = state.submitting;
  micBtn.onclick = () => {
    iniciarEscutaTarefa((texto) => {
      if (!texto || state.submitting) return;
      enviarTarefa(texto);
    });
  };
  inputRow.appendChild(input);
  inputRow.appendChild(micBtn);
  inputRow.appendChild(sendBtn);
  frag.appendChild(inputRow);

  if (state.taskListening) {
    const thinking = document.createElement("div");
    thinking.className = "thinking";
    thinking.textContent = "Ouvindo... fale a tarefa.";
    frag.appendChild(thinking);
  } else if (state.submitting) {
    const thinking = document.createElement("div");
    thinking.className = "thinking";
    thinking.textContent = "Interpretando sua tarefa...";
    frag.appendChild(thinking);
  }

  if (state.loadingTasks) {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "Carregando tarefas...";
    frag.appendChild(p);
  } else if (state.tasks.length === 0) {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "Nenhuma tarefa por aqui. Escreva algo acima para começar.";
    frag.appendChild(p);
  } else {
    state.tasks.forEach((t) => frag.appendChild(renderTaskRow(t)));
  }

  return frag;
}

function startOfDaySP(d) {
  // Meia-noite do dia de `d`, no fuso America/Sao_Paulo, como instante UTC comparável.
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Sao_Paulo", year: "numeric", month: "2-digit", day: "2-digit",
  }).format(d);
  return new Date(`${parts}T00:00:00-03:00`);
}

function dayLabelSP(d) {
  const hoje = startOfDaySP(new Date());
  const dia = startOfDaySP(d);
  const diffDias = Math.round((hoje - dia) / 86400000);
  if (diffDias === 0) return "Hoje";
  if (diffDias === 1) return "Ontem";
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", timeZone: "America/Sao_Paulo" });
}

function filtrarHistorico(history, filtro) {
  if (filtro === "tudo") return history;
  const agora = new Date();
  const limiteDias = filtro === "hoje" ? 0 : 6; // "semana" = hoje + 6 dias anteriores
  const inicio = new Date(startOfDaySP(agora).getTime() - limiteDias * 86400000);
  return history.filter((h) => new Date(h.created_at) >= inicio);
}

function filtrarPorIntervalo(history, dataInicio, dataFim) {
  // dataInicio/dataFim no formato YYYY-MM-DD, interpretados como dias no fuso America/Sao_Paulo.
  const inicio = new Date(`${dataInicio}T00:00:00-03:00`);
  const fim = new Date(`${dataFim}T23:59:59-03:00`);
  return history.filter((h) => {
    const d = new Date(h.created_at);
    return d >= inicio && d <= fim;
  });
}

function renderHistory() {
  const frag = document.createDocumentFragment();

  const searchRow = document.createElement("div");
  searchRow.className = "search-row";
  const searchInput = document.createElement("input");
  searchInput.placeholder = "Pergunte, ex: \"o que eu fiz na quinta passada?\"";
  searchInput.autocomplete = "off";
  searchInput.value = state.historySearchText;
  searchInput.oninput = (e) => { state.historySearchText = e.target.value; };
  const submitSearch = () => {
    const pergunta = searchInput.value.trim();
    if (!pergunta || state.historySearching) return;
    buscarPeriodoPorPergunta(pergunta);
  };
  searchInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submitSearch(); });
  const micBtn = document.createElement("button");
  micBtn.className = "mic-btn" + (state.historyListening ? " listening" : "");
  micBtn.title = "Perguntar por voz";
  micBtn.textContent = state.historyListening ? "●" : "🎤";
  micBtn.onclick = iniciarEscutaHistorico;
  searchRow.appendChild(searchInput);
  searchRow.appendChild(micBtn);
  frag.appendChild(searchRow);

  if (state.historySearching) {
    const thinking = document.createElement("div");
    thinking.className = "thinking";
    thinking.textContent = "Entendendo o período perguntado...";
    frag.appendChild(thinking);
  }

  if (state.historySearchResult) {
    const chip = document.createElement("div");
    chip.className = "search-result-chip";
    chip.innerHTML = `<span>Mostrando: <strong>${escapeHtml(state.historySearchResult.descricao)}</strong></span>`;
    const clearBtn = document.createElement("button");
    clearBtn.className = "clear-search";
    clearBtn.textContent = "limpar";
    clearBtn.onclick = () => setState({ historySearchResult: null, historySearchText: "" });
    chip.appendChild(clearBtn);
    frag.appendChild(chip);
  } else {
    const filterRow = document.createElement("div");
    filterRow.className = "filter-row";
    [["hoje", "Hoje"], ["semana", "Esta semana"], ["tudo", "Tudo"]].forEach(([key, label]) => {
      const chip = document.createElement("button");
      chip.className = "filter-chip" + (state.historyFilter === key ? " active" : "");
      chip.textContent = label;
      chip.onclick = () => setState({ historyFilter: key });
      filterRow.appendChild(chip);
    });
    frag.appendChild(filterRow);
  }

  const itens = state.historySearchResult
    ? filtrarPorIntervalo(state.history, state.historySearchResult.data_inicio, state.historySearchResult.data_fim)
    : filtrarHistorico(state.history, state.historyFilter);

  if (itens.length === 0) {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "Nada por aqui neste período.";
    frag.appendChild(p);
    return frag;
  }

  const card = document.createElement("div");
  card.className = "card";
  let ultimoDia = null;
  itens.forEach((h) => {
    const data = new Date(h.created_at);
    const rotuloDia = dayLabelSP(data);
    if (rotuloDia !== ultimoDia) {
      const header = document.createElement("div");
      header.className = "history-day-header";
      header.textContent = rotuloDia;
      card.appendChild(header);
      ultimoDia = rotuloDia;
    }
    const item = document.createElement("div");
    item.className = "history-item";
    const hora = data.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });
    const titulo = h.details?.titulo || h.details?.tarefa?.titulo || h.details?.tarefa?.title || "";
    const acaoLabel = { criada: "Criada", concluida: "Concluída", remarcada: "Remarcada", excluida: "Excluída" }[h.action] || h.action;
    item.innerHTML = `<div class="when">${hora}</div><div class="what"><strong>${acaoLabel}</strong>${titulo ? ": " + escapeHtml(titulo) : ""}</div>`;
    card.appendChild(item);
  });
  frag.appendChild(card);
  return frag;
}

function renderSettings() {
  const frag = document.createDocumentFragment();
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div style="margin-bottom:12px;font-size:14px;color:var(--muted)">Conectado como<br><strong style="color:var(--text)">${state.session.user.email}</strong></div>`;
  const logoutBtn = document.createElement("button");
  logoutBtn.className = "btn-secondary";
  logoutBtn.textContent = "Sair da conta";
  logoutBtn.onclick = handleLogout;
  card.appendChild(logoutBtn);
  frag.appendChild(card);
  return frag;
}

function renderApp() {
  const frag = document.createDocumentFragment();

  const header = document.createElement("header");
  header.className = "app-header";
  header.innerHTML = `<h1>Assistente Pessoal</h1>`;
  const chip = document.createElement("div");
  chip.className = "user-chip";
  chip.textContent = state.session.user.email;
  header.appendChild(chip);
  frag.appendChild(header);

  const tabs = document.createElement("div");
  tabs.className = "tabs";
  [["home", "Tarefas"], ["history", "Histórico"], ["settings", "Ajustes"]].forEach(([key, label]) => {
    const b = document.createElement("button");
    b.className = "tab" + (state.tab === key ? " active" : "");
    b.textContent = label;
    b.onclick = () => {
      setState({ tab: key });
      if (key === "history") loadHistory();
    };
    tabs.appendChild(b);
  });
  frag.appendChild(tabs);

  const content = document.createElement("div");
  if (state.tab === "home") content.appendChild(renderHome());
  else if (state.tab === "history") content.appendChild(renderHistory());
  else content.appendChild(renderSettings());
  frag.appendChild(content);

  const footer = document.createElement("div");
  footer.className = "footer-note";
  footer.textContent = "Suas tarefas são salvas na nuvem e sincronizadas com o Google Calendar.";
  frag.appendChild(footer);

  if (state.toast) {
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = state.toast;
    frag.appendChild(t);
  }

  return frag;
}

function render() {
  app.innerHTML = "";
  if (!state.session) {
    app.appendChild(renderLogin());
  } else {
    app.appendChild(renderApp());
  }
}

async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    setState({ session });
    await maybeSaveGoogleToken(session);
    await loadTasks();
  } else {
    render();
  }

  supabase.auth.onAuthStateChange(async (event, session) => {
    if (event === "SIGNED_IN" && session) {
      setState({ session });
      await maybeSaveGoogleToken(session);
      await loadTasks();
    } else if (event === "SIGNED_OUT") {
      setState({ session: null, tasks: [], history: [] });
    }
  });
}

init();
</script>
</body>
</html>
